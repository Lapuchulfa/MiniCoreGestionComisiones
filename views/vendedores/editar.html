{% extends "base.html" %}
{% block title %}Editar vendedor{% endblock %}
{% block content %}
    <h1>Editar vendedor</h1>

    <form method="POST" class="formulario">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" value="{{ vendedor.nombre }}" required>

        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" value="{{ vendedor.apellido }}" required>

        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" value="{{ vendedor.correo }}" required>

        <button type="submit" class="boton">Actualizar</button>
    </form>
{% endblock %}
