<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>{% block title %} MiniCore {% endblock %} - MiniCore Comisiones</title>
</head>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">MiniCore</a>
            <button class="navbar-toggler" type="button" data-bs-toggler="collapse" data-bs-target="#menu">
                <span class="collapse-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item px-3"><a class="nav-link px-3" href="{{url_for('vendedor_model.listar')}}">Vendedores </a></li>
                    <li class="nav-item px-3"> <a class="nav-link px-3" href="{{url_for('venta_model.listar')}}">Ventas</a></li>
                    <li class="nav-item px-3"><a class="nav-link px-3" href="{{url_for('venta_model.reporte')}}">Gestión de Comisiones</a></li>
                    <li class="nav-item px-3"><a class="nav-link px-3" href="{{url_for('comision_model.listar')}}">Comisiones</a></li>
                    <li class="nav-item px-3"><a class="nav-link px-3" href="{{url_for('regla_model.listar')}}">Reglas</a></li>
                </ul>

            </div>
        </div>
        
    </nav>

    <main class="container">
        {% with mensajes = get_flashed_messages() %}
            {% if mensajes %}
                <div class="alert alert-success alert-dismissible fade show">
                    {% for m in mensajes %}
                         {{ m }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
